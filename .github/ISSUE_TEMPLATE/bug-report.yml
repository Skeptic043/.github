name: Bug report
description: Something isn't working as expected
body:
  - type: input
    id: mod-version
    attributes:
      label: Mod version
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Attach BepInEx/LogOutput.log if you have it.
